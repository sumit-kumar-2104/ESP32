# Core profile — data audit, frozen splits, raw-amplitude comparisons,
# and supported cross-date / cross-room evaluations.
#
# Requires a populated Widar3.0 raw CSI directory (see README_raw_csi.md).
# Fails loudly if METAAI_DATA_DIR / METAAI_RAW_CSI_DIR are missing.

name: core
label: "raw-amplitude core comparisons + cross-date/room transfers"
use_synthetic: false
dates: ["20181109", "20181118"]
seeds: [42, 43, 44]
quality_policy: reject
min_packets: 64
read_packet_counts: false   # set true only when running on a workstation with slack

# Active gesture set. See docs/gesture_set_evidence.md — six-class is
# primary because gesture 4 = "Slide" on both 20181109 and 20181118.
# Chance and majority baselines are recomputed per split from these ids
# and never inherited across variants.
gesture_set:
  ids: [1, 2, 3, 4, 5, 6]
  label: "six-class-default"
  justification: >
    Widar3.0 Data instructions.pdf and metaai_sim/gesture_map.py both list
    gestures 1-4 (Push&Pull / Sweep / Clap / Slide) as identical on
    20181109 and 20181118. Ids 5 and 6 are overloaded across dates and
    are treated as a cross-date label shift, recorded in every
    cross-date split's notes.
  evidence: "docs/gesture_set_evidence.md"
  provenance: >
    Widar3.0 IEEE DataPort release, Data instructions.pdf,
    Table "Gesture ID for each date"; mirrored in
    metaai_sim/gesture_map.py::GESTURE_MAP_BY_DATE.

# Tasks 1-3 gate DA/DG suites. Core stays FALSE so the gate refuses
# domain-learning arms even if a downstream profile inherits from here.
tasks_1_3_ready: true

suites:
  - name: raw_indomain
    required: true
    kind: raw_amplitude
    feature_mode: raw
    arms:
      - logreg_raw
      - digital_mlp_raw
      - ota_raw_baseline
      - ota_raw_R1
      - ota_raw_R2
    splits:
      - kind: indomain_grouped
        id: indomain_20181109
        date: "20181109"
        val_frac: 0.15
        test_frac: 0.15
        seed: 42

  - name: raw_cross_date
    required: true
    kind: raw_amplitude
    feature_mode: raw
    arms:
      - logreg_raw
      - digital_mlp_raw
      - ota_raw_baseline
      - ota_raw_R1
    splits:
      - kind: held_out_date
        id: heldout_test_20181118
        train_dates: ["20181109"]
        test_date: "20181118"
        val_frac: 0.15
        seed: 42

  - name: raw_cross_room
    required: false
    kind: raw_amplitude
    feature_mode: raw
    arms:
      - logreg_raw
      - digital_mlp_raw
      - ota_raw_baseline
      - ota_raw_R1
    splits:
      - kind: cross_room
        id: cross_room_1_to_2
        source_room: 1
        target_room: 2
        val_frac: 0.15
        seed: 42
      - kind: cross_room
        id: cross_room_2_to_1
        source_room: 2
        target_room: 1
        val_frac: 0.15
        seed: 42
