# Five-class variant of the core profile — gesture 4 (Slide) excluded.
#
# Documented evidence in docs/gesture_set_evidence.md shows gesture 4 is
# identical (=Slide) on 20181109 and 20181118, so six-class is primary.
# This variant is kept runnable as a defence-in-depth comparison so the
# effect of gesture-4 exclusion can be quantified explicitly.

name: core_five_class
label: "raw-amplitude core (five-class variant, gesture 4 excluded)"
use_synthetic: false
dates: ["20181109", "20181118"]
seeds: [42, 43, 44]
quality_policy: reject
min_packets: 64
read_packet_counts: false

gesture_set:
  ids: [1, 2, 3, 5, 6]
  label: "five-class-drop-g4"
  justification: >
    Defence-in-depth variant. Earlier project work excluded gesture 4;
    docs/gesture_set_evidence.md shows gesture 4 IS identical across the
    two active dates, so this variant is exploratory rather than primary.
  evidence: "docs/gesture_set_evidence.md"
  provenance: >
    Kept runnable per the task-1 specification which required both a
    six-class and a five-class variant to be executable regardless of
    which is designated primary.

tasks_1_3_ready: true

suites:
  - name: raw_indomain
    required: true
    kind: raw_amplitude
    feature_mode: raw
    arms:
      - logreg_raw
      - digital_mlp_raw
      - ota_raw_baseline
      - ota_raw_R1
      - ota_raw_R2
    splits:
      - kind: indomain_grouped
        id: indomain_20181109_5c
        date: "20181109"
        val_frac: 0.15
        test_frac: 0.15
        seed: 42

  - name: raw_cross_date
    required: true
    kind: raw_amplitude
    feature_mode: raw
    arms:
      - logreg_raw
      - digital_mlp_raw
      - ota_raw_baseline
      - ota_raw_R1
    splits:
      - kind: held_out_date
        id: heldout_test_20181118_5c
        train_dates: ["20181109"]
        test_date: "20181118"
        val_frac: 0.15
        seed: 42

  - name: raw_cross_room
    required: false
    kind: raw_amplitude
    feature_mode: raw
    arms:
      - logreg_raw
      - digital_mlp_raw
      - ota_raw_baseline
      - ota_raw_R1
    splits:
      - kind: cross_room
        id: cross_room_1_to_2_5c
        source_room: 1
        target_room: 2
        val_frac: 0.15
        seed: 42
      - kind: cross_room
        id: cross_room_2_to_1_5c
        source_room: 2
        target_room: 1
        val_frac: 0.15
        seed: 42
